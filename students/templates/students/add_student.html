{% extends "students/base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="bg-white border border-gray-300 rounded-lg shadow-sm p-6 max-w-2xl mx-auto">

    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
        Add Student
    </h2>

    <form method="POST" class="space-y-4">

        {% csrf_token %}

        {% if form.errors %}
            <div class="bg-red-100 border border-red-300 text-red-700 rounded-lg p-4 mb-4">
                <p class="font-bold">
                    Please correct the errors below.
                </p>
            </div>
        {% endif %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-green-500 text-white px-6 py-3 rounded-lg font-bold text-lg hover:bg-green-600"
        >
            Add Student
        </button>

    </form>

    <a
        href="{% url 'student_list' %}"
        class="inline-block mt-6 text-blue-500 font-semibold hover:text-blue-700 underline"
    >
        ← Back to Students
    </a>

</div>

{% endblock %}
