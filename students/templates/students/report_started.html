{% extends "students/base.html" %}

{% block title %}
Generate Report
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white border border-gray-300 rounded-lg shadow-sm p-6 text-center">

    <h2 class="text-2xl font-bold text-gray-800 mb-4">
        Report Generation Started
    </h2>

    <p class="text-gray-600 mb-4">
        Your student report is being generated in the background.
    </p>

    <p class="text-sm text-gray-500 mb-6">
        Task ID: {{ task_id }}
    </p>

    <a
        href="{% url 'student_list' %}"
        class="inline-block bg-blue-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-600"
    >
        Back to Students
    </a>

    <a
        href="{% url 'view_report' %}"
        class="inline-block bg-yellow-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-yellow-600"
    >
        View Report
    </a>

</div>

{% endblock %}
