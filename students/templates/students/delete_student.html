{% extends "students/base.html" %}

{% block title %}
Delete Student
{% endblock %}

{% block content %}

<div class="bg-white border border-gray-300 rounded-lg shadow-sm p-6 max-w-2xl mx-auto">

    <!-- Page Title -->
    <h2 class="text-2xl font-bold text-red-500 text-center mb-6">
        Delete Student
    </h2>


    <!-- Warning Message -->
    <div class="bg-red-100 border border-red-300 rounded-lg p-4 mb-6">

        <p class="text-gray-800 text-lg">
            Are you sure you want to delete
            <strong>{{ student.name }}</strong>?
        </p>

        <p class="text-red-600 font-semibold mt-2">
            This action cannot be undone.
        </p>

    </div>


    <!-- Confirmation Form -->
    <form method="POST" class="flex gap-3">

        {% csrf_token %}

        <button
            type="submit"
            class="bg-red-500 text-white px-5 py-2 rounded font-bold hover:bg-red-600"
        >
            Yes, Delete Student
        </button>

        <a
            href="{% url 'student_list' %}"
            class="bg-gray-200 text-gray-800 px-5 py-2 rounded font-semibold hover:bg-gray-500 hover:text-white"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
